# Supabase Configuration
# Ref: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# ─── Edge Functions ────────────────────────────────────────────────────────────

# etherfuse-proxy: Proxy server-side para API Etherfuse.
# verify_jwt = false: Permite chamadas com anon key sem usuário logado.
# O frontend usa o anon JWT para autenticar — não o JWT de usuário.
[functions.etherfuse-proxy]
verify_jwt = false

# stellar-issuer: Edge Function de Assinatura server-side.
# verify_jwt = false: Essencial para que requisições CORS de Preflight (OPTIONS)
# não sejam bloqueadas pelo API Gateway com 401 Unauthorized, uma vez que browsers
# não enviam o header Authorization no preflight. O JWT é validado manualmente no Deno script (POST).
[functions.stellar-issuer]
verify_jwt = false
